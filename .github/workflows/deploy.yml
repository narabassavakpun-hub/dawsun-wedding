name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ปล่อยให้ deploy ที่กำลังรันอยู่ทำงานจนจบ แล้วค่อยคิวถัดไป
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ถ้าไม่มี secret เว็บจะ build ผ่านแต่ส่งคำอวยพร/สลิปไม่ได้ และไม่มีอะไรเตือน
      # จึงหยุดตั้งแต่ตรงนี้พร้อมบอกวิธีแก้ ดีกว่าปล่อยเว็บเสียขึ้นไปเงียบๆ
      - name: ตรวจว่ามี VITE_WISH_ENDPOINT
        env:
          VITE_WISH_ENDPOINT: ${{ secrets.VITE_WISH_ENDPOINT }}
        run: |
          if [ -z "$VITE_WISH_ENDPOINT" ]; then
            echo "::error::ไม่พบ secret ชื่อ VITE_WISH_ENDPOINT"
            echo "::error::ต้องเป็น *Repository secret* เท่านั้น (Environment secret ใช้ไม่ได้ เพราะ job นี้ไม่ได้ผูกกับ environment)"
            echo "::error::ไปที่ Settings > Secrets and variables > Actions > แท็บ Secrets > New repository secret"
            exit 1
          fi
          case "$VITE_WISH_ENDPOINT" in
            https://script.google.com/macros/s/*/exec) : ;;
            *) echo "::error::URL ต้องขึ้นต้น https://script.google.com/macros/s/ และลงท้าย /exec (ห้ามมี /u/1/)"; exit 1 ;;
          esac
          echo "พบ endpoint แล้ว (${#VITE_WISH_ENDPOINT} ตัวอักษร)"

      - name: Build
        env:
          # base path ต้องตรงกับชื่อ repo
          # ถ้า repo ชื่อ <user>.github.io ให้เปลี่ยนเป็น '/'
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_WISH_ENDPOINT: ${{ secrets.VITE_WISH_ENDPOINT }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
